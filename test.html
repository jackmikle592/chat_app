
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasla Live Chat</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: #f1f5f9;
}

header {
  padding: 18px;
  background: #111c2e;
  border-bottom: 1px solid #29384e;
}

header h2 { margin: 0; color: #34d399; }

.app {
  max-width: 850px;
  margin: 20px auto;
  padding: 12px;
}

.panel {
  background: #111c2e;
  border: 1px solid #29384e;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border-radius: 9px;
  border: 1px solid #43536a;
  background: #0b1220;
  color: white;
}

button {
  border: 0;
  padding: 11px 14px;
  margin: 4px 2px;
  border-radius: 9px;
  background: #10b981;
  color: #06251c;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .45; cursor: not-allowed; }

.secondary { background: #334155; color: white; }
.danger { background: #b91c1c; color: white; }

#messages {
  height: 300px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  background: #0b1220;
  border-radius: 10px;
}

.msg {
  max-width: 85%;
  padding: 10px 13px;
  border-radius: 12px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.mine { background: #087f5b; align-self: flex-start; }
.other { background: #29384e; align-self: flex-end; }

#videos {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}

video {
  width: 100%;
  background: black;
  border-radius: 10px;
}

#status { color: #9ca3af; font-size: 13px; }
@media(max-width: 500px) {
  .app { margin: 8px auto; }
  #videos { grid-template-columns: 1fr; }
  #messages { height: 260px; }
}
</style>
</head>

<body>
<header>
  <h2>Wasla Live</h2>
  <div id="status">جاري الاتصال...</div>
</header>

<div class="app">

  <section class="panel">
    <h3>المعرّف ديالك</h3>
    <input id="myId" readonly placeholder="جاري الإنشاء...">
    <button id="copyId" class="secondary">نسخ المعرّف</button>
    <button id="copyLink" class="secondary">نسخ رابط الدعوة</button>

    <h3>الاتصال بشخص آخر</h3>
    <input id="targetId" placeholder="دخل Peer ID ديال الشخص الآخر" dir="ltr">
    <button id="connect">اتصال وفتح الشات</button>
  </section>

  <section class="panel">
    <h3>المحادثة</h3>
    <div id="messages"></div>

    <form id="chatForm">
      <input id="message" placeholder="كتب رسالة..." maxlength="2000">
      <button id="send" disabled>إرسال</button>
    </form>
  </section>

  <section class="panel">
    <h3>المكالمات</h3>
    <button id="audio" disabled>☎ مكالمة صوتية</button>
    <button id="videoCall" disabled>▣ مكالمة فيديو</button>
    <button id="hangup" class="danger" disabled>إنهاء المكالمة</button>

    <div id="incoming" hidden>
      <p>كاينة مكالمة واردة!</p>
      <button id="accept">قبول المكالمة</button>
      <button id="reject" class="danger">رفض</button>
    </div>

    <div id="videos">
      <div>
        <p>أنت</p>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div>
        <p>الطرف الآخر</p>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>
  </section>

  <p>
    الرسائل غير محفوظة. ما تشاركش معلومات حساسة فهاد النسخة.
  </p>
</div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);

let peer;
let connection = null;
let currentCall = null;
let incomingCall = null;
let localStream = null;

function status(text) {
  $("status").textContent = text;
}

function showMessage(text, mine) {
  const div = document.createElement("div");
  div.className = "msg " + (mine ? "mine" : "other");
  div.textContent = text;
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function updateButtons(connected) {
  $("send").disabled = !connected;
  $("audio").disabled = !connected;
  $("videoCall").disabled = !connected;
}

function attachConnection(conn) {
  if (connection && connection !== conn) {
    connection.close();
  }

  connection = conn;

  conn.on("open", () => {
    $("targetId").value = conn.peer;
    updateButtons(true);
    status("متصل بالشات");
  });

  conn.on("data", data => {
    if (data && data.type === "message" &&
        typeof data.text === "string") {
      showMessage(data.text, false);
    }
  });

  conn.on("close", () => {
    if (connection === conn) {
      connection = null;
      updateButtons(false);
      status("انقطع الاتصال");
    }
  });

  conn.on("error", () => {
    status("وقع خطأ فالشات");
  });
}

peer = new Peer();

peer.on("open", id => {
  $("myId").value = id;
  status("جاهز للاتصال");

  const invited = new URLSearchParams(location.search).get("peer");

  if (invited && invited !== id) {
    $("targetId").value = invited;
  }
});

peer.on("connection", conn => {
  attachConnection(conn);
});

peer.on("error", err => {
  console.error(err);
  status("مشكلة فالربط: " + err.type);
});

$("connect").onclick = () => {
  const id = $("targetId").value.trim();

  if (!id || !peer) return;
  if (id === $("myId").value) {
    alert("ما يمكنش تتاصل براسك");
    return;
  }

  status("جاري الاتصال...");
  attachConnection(peer.connect(id, { reliable: true }));
};

$("chatForm").onsubmit = event => {
  event.preventDefault();

  const text = $("message").value.trim();

  if (!text || !connection || !connection.open) return;

  connection.send({
    type: "message",
    text
  });

  showMessage(text, true);
  $("message").value = "";
};

$("copyId").onclick = async () => {
  if (!$("myId").value) return;
  await navigator.clipboard.writeText($("myId").value);
  alert("تنسخ المعرّف");
};

$("copyLink").onclick = async () => {
  const id = $("myId").value;
  if (!id) return;

  const link = location.origin + location.pathname +
    "?peer=" + encodeURIComponent(id);

  await navigator.clipboard.writeText(link);
  alert("صيفط رابط الدعوة للطرف الآخر");
};

async function getMedia(withVideo) {
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error("خاص HTTPS وإذن الميكروفون والكاميرا");
  }

  if (localStream) {
    const hasVideo = localStream.getVideoTracks().length > 0;
    if (!withVideo || hasVideo) return localStream;

    localStream.getTracks().forEach(t => t.stop());
  }

  localStream = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: withVideo
  });

  $("localVideo").srcObject = localStream;
  $("videos").style.display = "grid";

  return localStream;
}

function endCall() {
  if (currentCall) {
    currentCall.close();
    currentCall = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }

  $("localVideo").srcObject = null;
  $("remoteVideo").srcObject = null;
  $("videos").style.display = "none";
  $("hangup").disabled = true;
}

function setupCall(call) {
  currentCall = call;

  call.on("stream", stream => {
    $("remoteVideo").srcObject = stream;
    $("videos").style.display = "grid";
  });

  call.on("close", endCall);
  call.on("error", endCall);

  $("hangup").disabled = false;
}

async function makeCall(withVideo) {
  const target = $("targetId").value.trim();

  if (!target) {
    alert("دخل Peer ID ديال الطرف الآخر");
    return;
  }

  try {
    const stream = await getMedia(withVideo);
    const call = peer.call(target, stream);
    setupCall(call);
    status("جاري الاتصال الصوتي/المرئي...");
  } catch (err) {
    alert("تعذر تشغيل الميكروفون أو الكاميرا: " + err.message);
    endCall();
  }
}

peer.on("call", call => {
  if (currentCall || incomingCall) {
    call.close();
    return;
  }

  incomingCall = call;
  $("incoming").hidden = false;
});

$("accept").onclick = async () => {
  if (!incomingCall) return;

  try {
    const stream = await getMedia(true);
    const call = incomingCall;
    incomingCall = null;
    $("incoming").hidden = true;

    call.answer(stream);
    setupCall(call);
  } catch (err) {
    alert("تعذر الوصول للميكروفون أو الكاميرا: " + err.message);
    if (incomingCall) incomingCall.close();
    incomingCall = null;
    $("incoming").hidden = true;
  }
};

$("reject").onclick = () => {
  if (incomingCall) incomingCall.close();
  incomingCall = null;
  $("incoming").hidden = true;
};

$("audio").onclick = () => makeCall(false);
$("videoCall").onclick = () => makeCall(true);
$("hangup").onclick = endCall;

window.addEventListener("beforeunload", () => {
  endCall();
  if (connection) connection.close();
  if (peer) peer.destroy();
});
</script>
</body>
</html>
